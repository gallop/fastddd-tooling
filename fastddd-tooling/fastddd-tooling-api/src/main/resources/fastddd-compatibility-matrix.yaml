# FastDDD 跨产品兼容矩阵 —— VER-001 机器可读规范源
# ====================================================================
# 本文件是 Studio → Tooling → Framework 三产品版本组合的【唯一机器可读契约】。
# 人类可读镜像见 docs/COMPATIBILITY_MATRIX.md（"跨产品兼容矩阵"小节）。
#
# 用途：
#   1. 生成通道（Maven Plugin / Studio）从本矩阵取【目标 Framework 版本】，
#      不复制 Studio/Tooling 自身版本（VER-001 步骤 5）。
#   2. 构建期/CI 校验当前 reactor 版本组合为已登记的合法组合（VER-001 步骤 6）。
#   3. 定义每个 Framework 版本线的平台 manifest（Boot/Java/Spring AI/SpringDoc/Knife4j）。
#
# 版本独立化说明（ADR-005 §3.2）：
#   三仓分别拥有自身 revision，并通过独立上游版本属性消费已发布制品。
#   本矩阵登记允许的差异化组合，CI 据此阻断未认证组合；当前三个版本值
#   相同只代表首个候选组合，不表示构建或发布节奏锁步。
#   （本文件不含 Maven filtering 占位符，确保字节稳定——见 VersionGovernanceContractTest）
