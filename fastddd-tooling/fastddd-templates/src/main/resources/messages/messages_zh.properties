# FastDDD 模板文案字典（中文，缺省语言）
#
# 约定：
# - 键命名 <family>.<template|concern>.<semantic>，全小写点分层级，模板内 ${msg.a.b.c} 引用；
# - families: common / anemic / rich / proj / proj.context / proj.security / proj.mc / proj.security.mc / vue；
# - 值中的前导/尾随空格一律写作 \u0020（构建时转义），Properties 会剥离值的前导空白、
#   尾随空白在编辑器中不可见，故两者都必须显式转义；
# - en 缺失的键自动回退本文件（加载时 zh 全量 + en 覆盖深合并）；
# - 仅收录「生成输出」文案；<#-- --> FTL 注释不字典化。

