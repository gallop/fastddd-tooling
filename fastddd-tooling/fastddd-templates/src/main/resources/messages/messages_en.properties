# FastDDD template message dictionary (English)
#
# Conventions:
# - Keys <family>.<template|concern>.<semantic>, lowercase dot-separated, referenced as ${msg.a.b.c};
# - families: common / anemic / rich / proj / proj.context / proj.security / proj.mc / proj.security.mc / vue;
# - Write leading/trailing spaces inside values as \u0020 (escaped at build time): Properties strips
#   leading whitespace and trailing whitespace is invisible in editors, so both must be explicit;
# - Keys missing here fall back to messages_zh.properties at load time (zh base + en overlay);
# - Only generated-output copy is keyed; <#-- --> FTL comments are not localized.

