proj.pom.versionAxesNote1=Two independent version axes: fastddd.version = Framework runtime; fastddd-tooling.version = build-time plugin.
proj.pom.versionAxesNote2=Version values are injected separately by the generation channel according to the compatibility matrix and are not derived from each other.
proj.pom.tomcatSecurityNote=ECO-RELEASE-04/S3 security coverage: tomcat-embed CVE-2026-65905/65182/68525 (3 x CRITICAL, the 10.1.x line fix was actually released in 10.1.59).
proj.pom.tomcatImportNote1=Generated project uses parent=spring-boot-starter-parent: importing fastddd-bom cannot override the Boot dependencyManagement
proj.pom.tomcatImportNote2=inherited from the parent (import only fills gaps and does not override inheritance), so the official Boot version property channel must be used; this line can be removed once Boot's managed version is >= 10.1.59.
proj.pom.druidVersionNote=Connection pool version: aligned with the fastddd-bom managed value (the generated project uses the Boot parent and is not managed by the BOM, so the version must be pinned explicitly)
