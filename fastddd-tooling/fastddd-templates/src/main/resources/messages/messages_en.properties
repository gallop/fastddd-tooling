anemic.controller.readonly.note1=GEN-002: generates a <b>read-only</b> controller ({@link BaseReadOnlyController}) by default, exposing GET query endpoints only—
anemic.controller.readonly.note2=It no longer extends the deprecated {@code BaseController} and does not expose write endpoints by default (PO is not accepted as an external write request).
anemic.controller.readonly.note3=To enable write endpoints, generate DTO/Command write APIs with {@code writeMode=DTO} instead of accepting PO directly.
anemic.controller.writeMode.note1=Now in <b>writeMode=DTO</b>: POST/PUT/DELETE write endpoints are generated,
anemic.controller.writeMode.reqPrefix=Using\u0020
anemic.controller.writeMode.reqSuffix=\u0020(with {@code @Valid} validation)
anemic.controller.writeMode.note2=as write request bodies, mapped to entities via {@code BeanUtils}. <b>Write/data permissions are business onboarding gates</b>—
anemic.controller.writeMode.note3=Add authorization annotations such as {@code @PreAuthorize} on the class or methods before opening them (GEN-002 Phase C extension point).
anemic.controller.extpt.title=GEN-002 Permission Extension Points (Phase C)
anemic.controller.extpt.note1=This class reserves commented-out hooks for authorization and data permissions—<b>no actual annotations or security dependencies included</b>.
anemic.controller.extpt.note2=Once Spring Security (or {@code fast-ddd-security-starter}) is introduced,
anemic.controller.extpt.note3=uncomment the corresponding lines and add the imports to activate them. The legacy default {@code BaseController}
anemic.controller.extpt.note4=generated unauthenticated write endpoints, which was the root cause of exposed security risks—GEN-002 firmly keeps write endpoints hidden by default
anemic.controller.extpt.note5=and makes the authorization integration path explicit:
anemic.controller.extpt.classAuth=<b>Class-level authorization</b>: uncomment on the class declaration {@code // @@PreAuthorize("hasRole('ADMIN')")}
anemic.controller.extpt.methodAuthPrefix=<b>Method-level authorization</b>: uncomment on each write method\u0020
anemic.controller.extpt.dataAuth=<b>Data permission</b>: uncomment above the method signature
anemic.controller.extpt.dataAuthHint=—as a declarative data-permission integration hint (the business side must define the {@code @DataPermission} annotation and aspect)
anemic.controller.extpt.classAuthHint=uncomment + import to enable class-level authorization
anemic.controller.extpt.dataPermHint=declarative data-permission integration hint—uncomment, and the business side defines the @DataPermission annotation and aspect
anemic.controller.readonly.ifaceComment=BaseReadOnlyController already provides read-only query endpoints:
