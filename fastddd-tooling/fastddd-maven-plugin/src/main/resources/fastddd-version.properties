# ====================================================================
# 生成通道默认版本（构建期经 Maven 资源过滤写入，见 InitProjectMojo）
#   fastddd.version        -> 目标 Framework 版本：取 Tooling 构建所认证的
#                             上游 fastddd-framework.version，不是 Tooling 自身 revision
#   fastddd.tooling.version-> Tooling 自身版本：与 fastddd-maven-plugin 同 reactor
#                             发布，作为生成项目引用的插件版本
# 两条版本轴相互独立（ECO-003 版本解耦），均可用 -Dinit.* 显式覆盖。
# ====================================================================
fastddd.version=@fastddd-framework.version@
fastddd.tooling.version=@revision@
