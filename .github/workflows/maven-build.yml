# FastDDD Framework Maven Build and Test
# Author: gallop
# Created: 2025-01-10

name: Maven Build and Test

on:
  workflow_call:
    inputs:
      java-version:
        description: 'Java version to use'
        required: false
        default: '21'
        type: string
      maven-profile:
        description: 'Maven profile to activate'
        required: false
        default: 'test'
        type: string
      skip-tests:
        description: 'Skip tests during build'
        required: false
        default: false
        type: boolean
    outputs:
      build-status:
        description: 'Build status'
        value: ${{ jobs.maven-build.outputs.build-status }}
      test-results:
        description: 'Test results summary'
        value: ${{ jobs.maven-build.outputs.test-results }}

env:
  MAVEN_OPTS: '-Xmx2048m -XX:MaxMetaspaceSize=512m'
  MAVEN_CLI_OPTS: '--batch-mode --errors --fail-at-end --show-version'

jobs:
  maven-build:
    name: Maven Build and Test
    runs-on: ubuntu-latest
    
    outputs:
      build-status: ${{ steps.build-result.outputs.status }}
      test-results: ${{ steps.test-result.outputs.summary }}
    
    steps:
    - name: Checkout source code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Set up JDK ${{ inputs.java-version }}
      uses: actions/setup-java@v4
      with:
        java-version: ${{ inputs.java-version }}
        distribution: 'temurin'
        cache: maven
    
    - name: Cache Maven dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.m2/repository
          ~/.m2/wrapper
        key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml', '.mvn/wrapper/maven-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-maven-
    
    - name: Validate Maven project
      run: |
        echo "🔍 Validating Maven project structure..."
        ./mvnw ${{ env.MAVEN_CLI_OPTS }} validate
        
        echo "📋 Analyzing dependencies..."
        ./mvnw ${{ env.MAVEN_CLI_OPTS }} dependency:analyze
        
        echo "🔧 Checking for dependency conflicts..."
        ./mvnw ${{ env.MAVEN_CLI_OPTS }} dependency:tree
    
    - name: Compile source code
      run: |
        echo "🏗️ Compiling source code..."
        ./mvnw ${{ env.MAVEN_CLI_OPTS }} clean compile -P${{ inputs.maven-profile }}
    
    - name: Run unit tests
      if: ${{ !inputs.skip-tests }}
      run: |
        echo "🧪 Running unit tests..."
        ./mvnw ${{ env.MAVEN_CLI_OPTS }} test -P${{ inputs.maven-profile }} \
          -Dmaven.test.failure.ignore=false \
          -Dsurefire.useFile=false
    
    - name: Run integration tests
      if: ${{ !inputs.skip-tests }}
      run: |
        echo "🔗 Running integration tests..."
        ./mvnw ${{ env.MAVEN_CLI_OPTS }} verify -P${{ inputs.maven-profile }} \
          -DskipUnitTests=true \
          -Dfailsafe.useFile=false
      continue-on-error: true
    
    - name: Generate test coverage report
      if: ${{ !inputs.skip-tests }}
      run: |
        echo "📊 Generating test coverage report..."
        ./mvnw ${{ env.MAVEN_CLI_OPTS }} jacoco:report -P${{ inputs.maven-profile }}
    
    - name: Package application
      run: |
        echo "📦 Packaging application..."
        ./mvnw ${{ env.MAVEN_CLI_OPTS }} package -P${{ inputs.maven-profile }} \
          ${{ inputs.skip-tests && '-DskipTests' || '' }}
    
    - name: Generate project documentation
      run: |
        echo "📚 Generating project documentation..."
        ./mvnw ${{ env.MAVEN_CLI_OPTS }} javadoc:aggregate -P${{ inputs.maven-profile }}
        ./mvnw ${{ env.MAVEN_CLI_OPTS }} site:site -P${{ inputs.maven-profile }}
      continue-on-error: true
    
    - name: Collect build artifacts
      run: |
        echo "📁 Collecting build artifacts..."
        find . -name "*.jar" -not -path "*/target/dependency/*" -not -path "*/.m2/*" > artifacts.txt
        echo "Found artifacts:"
        cat artifacts.txt
    
    - name: Set build result
      id: build-result
      run: |
        if [ ${{ job.status }} == 'success' ]; then
          echo "status=success" >> $GITHUB_OUTPUT
          echo "✅ Build completed successfully"
        else
          echo "status=failure" >> $GITHUB_OUTPUT
          echo "❌ Build failed"
        fi
    
    - name: Set test result summary
      id: test-result
      if: ${{ !inputs.skip-tests }}
      run: |
        # Parse test results from surefire reports
        TOTAL_TESTS=$(find . -name "TEST-*.xml" -exec grep -h "tests=" {} \; | sed 's/.*tests="\([0-9]*\)".*/\1/' | awk '{sum+=$1} END {print sum}')
        FAILED_TESTS=$(find . -name "TEST-*.xml" -exec grep -h "failures=" {} \; | sed 's/.*failures="\([0-9]*\)".*/\1/' | awk '{sum+=$1} END {print sum}')
        ERROR_TESTS=$(find . -name "TEST-*.xml" -exec grep -h "errors=" {} \; | sed 's/.*errors="\([0-9]*\)".*/\1/' | awk '{sum+=$1} END {print sum}')
        SKIPPED_TESTS=$(find . -name "TEST-*.xml" -exec grep -h "skipped=" {} \; | sed 's/.*skipped="\([0-9]*\)".*/\1/' | awk '{sum+=$1} END {print sum}')
        
        TOTAL_TESTS=${TOTAL_TESTS:-0}
        FAILED_TESTS=${FAILED_TESTS:-0}
        ERROR_TESTS=${ERROR_TESTS:-0}
        SKIPPED_TESTS=${SKIPPED_TESTS:-0}
        PASSED_TESTS=$((TOTAL_TESTS - FAILED_TESTS - ERROR_TESTS - SKIPPED_TESTS))
        
        echo "summary=Total: $TOTAL_TESTS, Passed: $PASSED_TESTS, Failed: $FAILED_TESTS, Errors: $ERROR_TESTS, Skipped: $SKIPPED_TESTS" >> $GITHUB_OUTPUT
        
        echo "📊 Test Results Summary:"
        echo "  Total Tests: $TOTAL_TESTS"
        echo "  Passed: $PASSED_TESTS"
        echo "  Failed: $FAILED_TESTS"
        echo "  Errors: $ERROR_TESTS"
        echo "  Skipped: $SKIPPED_TESTS"
    
    - name: Upload test reports
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-reports-${{ inputs.maven-profile }}
        path: |
          **/target/surefire-reports/
          **/target/failsafe-reports/
          **/target/site/jacoco/
        retention-days: 30
    
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: build-artifacts-${{ inputs.maven-profile }}
        path: |
          **/target/*.jar
          !**/target/dependency/
          !**/target/*-sources.jar
          !**/target/*-javadoc.jar
        retention-days: 7
    
    - name: Upload documentation
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: documentation-${{ inputs.maven-profile }}
        path: |
          target/site/
          **/target/site/apidocs/
        retention-days: 30

  dependency-check:
    name: Dependency Security Check
    runs-on: ubuntu-latest
    needs: maven-build
    if: success()
    
    steps:
    - name: Checkout source code
      uses: actions/checkout@v4
    
    - name: Set up JDK ${{ inputs.java-version }}
      uses: actions/setup-java@v4
      with:
        java-version: ${{ inputs.java-version }}
        distribution: 'temurin'
        cache: maven
    
    - name: Run OWASP Dependency Check
      run: |
        echo "🔒 Running OWASP Dependency Check..."
        ./mvnw ${{ env.MAVEN_CLI_OPTS }} org.owasp:dependency-check-maven:check \
          -DfailBuildOnCVSS=7 \
          -DsuppressionsLocation=.github/dependency-check-suppressions.xml
      continue-on-error: true
    
    - name: Upload dependency check report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: dependency-check-report
        path: target/dependency-check-report.html
        retention-days: 30
