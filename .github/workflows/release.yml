name: Central Release

# Maven Central 发布工作流（镜像 framework 仓 release.yml 形制）：workflow_dispatch
# 手动触发（Central 不可逆，发布按钮留在 Owner 手里）。
# 发布链路：verify 门禁（全量测试，含版本治理契约——未登记组合在此被阻断）
# → GPG 签名 → Portal 暂存区（autoPublish=false，人工核对后 Publish）。
# 凭证：仓库 secrets（CENTRAL_USERNAME/CENTRAL_PASSWORD/GPG_PRIVATE_KEY/GPG_PASSPHRASE），
# 经 setup-java 注入 settings.xml（server-id=central 与 pom publishingServerId 对应），
# 明文不落仓不落日志。
# Tooling 双轴：revision（Tooling 线）与 framework-version（上游 Framework 线）分别注入；
# Framework 制品由 runner 从 Maven Central 直解（内网仓不参与本工作流）。

on:
  workflow_dispatch:
    inputs:
      revision:
        description: 'Release version, plain X.Y.Z (no -SNAPSHOT suffix)'
        required: true
        type: string
      framework-version:
        description: 'Framework version to build against (must be a matrix-registered pairing)'
        required: true
        default: '1.1.3'
        type: string

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Guard revision format
        run: |
          if ! [[ "${{ inputs.revision }}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::revision must be a plain X.Y.Z release version (no -SNAPSHOT)"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21, Central credentials and GPG key
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          server-id: central
          server-username: CENTRAL_USERNAME
          server-password: CENTRAL_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: GPG_PASSPHRASE

      # 门禁轮：全量测试（152/0/0/2 口径；未登记的版本组合被治理契约阻断）
      - name: Build and verify
        run: >-
          ./mvnw -B clean verify
          -Drevision=${{ inputs.revision }}
          -Dfastddd-framework.version=${{ inputs.framework-version }}

      # 发布轮：同一份源码同一 revision，测试编译+运行全跳；-Pcentral 激活 GPG 签名与
      # Portal 上传，-Prelease-artifacts 附带 sources/javadoc；consumer-tests 为测试
      # 聚合器不外发（pom 侧 maven.deploy.skip=true 双保险，此处再显式排除）。
      - name: Deploy to Central Portal (staging)
        run: >-
          ./mvnw -B deploy
          -Drevision=${{ inputs.revision }}
          -Dfastddd-framework.version=${{ inputs.framework-version }}
          -Dmaven.test.skip=true
          -Pcentral,release-artifacts
          -pl '!fastddd-tooling-consumer-tests'
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          # setup-java 的 gpg-passphrase 输入只声明环境变量名；真正的口令值
          # 由本步骤导出该变量，Maven 在 settings.xml 的 gpg.passphrase 服务条目
          # 中经 ${env.GPG_PASSPHRASE} 运行时解析——缺此行则 gpg 拿空口令签名失败
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
